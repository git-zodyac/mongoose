name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: ci (mongoose ${{ matrix.mongoose }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `8` and `9` resolve to the newest 8.x / 9.x at run time. The lockfile
        # pins one version for local dev; the matrix overrides it below.
        mongoose: ["8", "9"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.x (not 20.x): tsdown loads tsdown.config.ts via the optional
          # `unrun` peer dep on Node <22.13, and unrun itself requires Node
          # ^22.13.0 || >=24.0.0 (2026-08-21 CI build failures - "unrun"
          # import error). This only affects the build TOOLCHAIN's Node
          # version, not the package's own target (tsdown.config.ts still
          # targets node20.0.0 for consumers).
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Mongoose ${{ matrix.mongoose }} (latest)
        run: npm install --no-save --ignore-scripts mongoose@${{ matrix.mongoose }}

      - name: Show resolved versions
        run: npm ls mongoose zod

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Check package types (attw)
        run: npm run check:types

      - name: Check package publishing (publint)
        run: npm run check:pack
